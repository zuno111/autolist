name: AutoList 실행파일 빌드

# 코드가 올라오거나(main), 수동 실행하거나, v로 시작하는 태그를 달면 빌드.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: node20-win-x64
            out: AutoList-Windows.exe
            label: 윈도우
          - os: macos-latest
            target: node20-macos-arm64
            out: AutoList-Mac-AppleSilicon
            label: 맥(M1~)
          - os: macos-13
            target: node20-macos-x64
            out: AutoList-Mac-Intel
            label: 맥(인텔)
          - os: ubuntu-latest
            target: node20-linux-x64
            out: AutoList-Linux
            label: 리눅스
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 의존성 설치
        run: npm install --omit=optional --no-audit --no-fund
      - name: 실행파일 빌드
        run: npx pkg . --no-bytecode --public --targets ${{ matrix.target }} --output "dist/${{ matrix.out }}"
      - name: 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}

  # 태그(v1.0.0 등)를 달면 완성 파일을 Release로 묶어 공개 다운로드 링크 생성
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
